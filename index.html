function fmtTime(ts){ if(!ts) return ""; return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function elapsed(ts){ const m=Math.floor((now()-ts)/60000); if(m<1) return "recién"; if(m<60) return `hace ${m} min`; const h=Math.floor(m/60); return `hace ${h} h ${m%60} min`; }

/* ---------- sonido / vibración / notificación ---------- */
// los navegadores bloquean el sonido que no viene de un toque directo del usuario (para evitar
// autoplay molesto). Como nuestros avisos se disparan solos (chequeos automáticos, no un click),
// hay que "desbloquear" el audio en el primer toque que el usuario haga en la pantalla, y despues
// reusar ese mismo contexto siempre — crear uno nuevo cada vez vuelve a quedar bloqueado.
let audioCtx = null;
function ensureAudioContext() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
document.addEventListener("click", () => ensureAudioContext(), { once: true });
document.addEventListener("touchend", () => ensureAudioContext(), { once: true });

function playAlert() {
  try {
    const ctx = ensureAudioContext();
    if (!ctx) return;
    const beep = (start) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.9, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.2);
    };
    const t0 = ctx.currentTime;
    beep(t0); beep(t0 + 0.25); beep(t0 + 0.5);
  } catch (e) { /* el navegador bloqueó el audio */ }
}
function notifyUser(title, body) {
  playAlert();
  if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 150]);
  try {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") new Notification(title, { body });
  } catch (e) {}
}

// registra este celular para recibir notificaciones push aunque la app esté cerrada.
// si algo falla acá (falta la clave VAPID, el navegador no soporta push, etc.) la app
// sigue funcionando normal igual, esto es 100% adicional.
async function initPush(name) {
  try {
    if (VAPID_KEY === "PEGA_ACA_TU_VAPID_KEY") return; // todavia no se configuro
    if (!("serviceWorker" in navigator) || typeof Notification === "undefined") return;
    if (Notification.permission !== "granted") return;
    const supported = await isSupported().catch(() => false);
    if (!supported) return;
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) {
      const current = (data.staff[name] && data.staff[name].fcmTokens) || [];
      // se guarda SOLO el token más nuevo (no se acumula) — así no llegan avisos duplicados
      // desde tokens viejos de pruebas anteriores en el mismo celular.
      if (current.length !== 1 || current[0] !== token) saveStaff(name, { fcmTokens: [token] });
    }
    onMessage(messaging, (payload) => {
      const title = (payload.notification && payload.notification.title) || "Control Seguridad FADU";
      const body = (payload.notification && payload.notification.body) || "";
      // ojo: acá NO usamos notifyUser() (que tiene nuestro beep casero) — para los avisos que vienen
      // por push, dejamos que el sistema operativo del celular use su propio sonido de notificación,
      // que se escucha bien fuerte y claro incluso con la pantalla apagada. El beep casero se sigue
      // usando para los avisos mientras la app está realmente abierta y mirando la pantalla (ver
      // checkPendingNotifications / startNoteChecker), ahí sí tiene sentido.
      if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 150]);
      try {
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          const n = new Notification(title, { body, icon: "icons/icon-192.png" });
          n.onclick = () => { window.focus(); n.close(); };
        }
      } catch (e) {}
    });
  } catch (e) { /* sin push, pero la app sigue andando igual */ }
}

const notifiedRequestKeys = new Set();
function checkPendingNotifications() {
  if (!user || !data || user.role !== "recorrido") return;
  const myZones = user.zones || [];
  if (!myZones.length) return;
  Object.values(data.doors).forEach(d => {
    if (d.pendingRequest && myZones.includes(d.sector)) {
      const key = `${d.id}-${d.pendingRequest.requestedAt}`;
      if (!notifiedRequestKeys.has(key)) {
        notifiedRequestKeys.add(key);
        notifyUser("Control Seguridad FADU", `${d.pendingRequest.requestedBy} pide ${d.pendingRequest.type === "open" ? "abrir" : "cerrar"} ${d.label}`);
      }
    }
  });
}

const notifiedNoteKeys = new Set();
let noteCheckInterval = null;
function startNoteChecker() {
  if (noteCheckInterval) return;
  noteCheckInterval = setInterval(() => {
    if (!user || !data) return;
    const d = new Date();
    const nowHM = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const todayKey = d.toISOString().slice(0,10);
    const dow = d.getDay();
    (data.notes || []).forEach(n => {
      if (!n.time || n.time !== nowHM) return;
      if (n.recurrence === "semanal" && !(n.daysOfWeek||[]).includes(dow)) return;
      const key = n.recurrence === "semanal" ? `${n.id}-${todayKey}` : n.id;
      if (notifiedNoteKeys.has(key)) return;
      notifiedNoteKeys.add(key);
      notifyUser("Recordatorio · Control Seguridad FADU", n.text);
    });
  }, 20000);
}

    doors[id] = { id, label, sector, sectorLabel, type, status: "closed", keyHolders: [], pendingRequest: null, routine, hasTV: !!hasTV, clean: false, anomalies: [], excludeFromStats: !!excludeFromStats };
  };
  // Subsuelo: Aula Magna + aulas 1 a 4
  add("SS-MAGNA", "Aula Magna", "SS", "Subsuelo", "aula", true);
  for (let n = 1; n <= 4; n++) add(`SS${n}`, String(n).padStart(2,"0"), "SS", "Subsuelo", "aula", true);
  const TV_100 = ["106","107","109","115","118"];
  for (let n = 101; n <= 124; n++) {
    add(String(n), String(n), "100", "Sector 100", "aula", true, TV_100.includes(String(n)));
    if (n === 111) add("S", "Aula S (Feldman)", "100", "Sector 100", "aula", false);
  }
  const SPLIT = [112, 124]; // puntas del Entrepiso: sus 8 sub-aulas con letra van al sector Auxiliares
  const TV_EP = ["EP101","EP103","EP106","EP109","EP111","EP113","EP115","EP121","EP123"];
  for (let n = 101; n <= 124; n++) {
    if (SPLIT.includes(n)) {
      ["A","B","C","D"].forEach(l => add(`EP${n}${l}`, `EP${n}${l}`, "EP-AUX", "Auxiliares Entrepiso", "aula", true, false));
    } else {
      const id = `EP${n}`;
      add(id, id, "EP", "Entrepiso", "aula", true, TV_EP.includes(id));
    }
    if (n === 110) add("EP-DISENO", "Depósito de Diseño", "EP", "Entrepiso", "deposito", false);
  }
  const TV_200 = ["205","206","207","208","226","228"];
  for (let n = 201; n <= 228; n++) add(String(n), String(n), "200", "Sector 200", "aula", true, TV_200.includes(String(n)));
  for (let n = 1; n <= 38; n++) { const num = String(n).padStart(2,"0"); add(`D${num}`, `Depósito ${num}`, "DEP", "Depósitos", "deposito", true); }
  return doors;
}

async function persist() {

// Vuelve a calcular los datos "de fábrica" de cada puerta (nombre, sector, si tiene TV, si es de rutina, etc.)
// a partir del código actual, pero conserva el estado real (abierta/cerrada, llave, pedidos, limpieza, anomalías).
// Así, cuando agregamos o corregimos algo en el código (ej: un ícono de TV que faltaba), se autocorrige solo
// en cualquier celular que ya tenía datos guardados, sin que haya que borrar nada a mano.
function reconcileDoors(storedDoors) {
  const canonical = buildInitialDoors();
  const result = {};
  Object.keys(canonical).forEach(id => {
    const c = canonical[id];
    const s = storedDoors[id];
    const pr = s && s.pendingRequest ? { ...s.pendingRequest, catedra: s.pendingRequest.catedra || null } : (s ? s.pendingRequest : c.pendingRequest);
    // "keyHolder" (texto, uno solo) es el formato viejo; "keyHolders" (lista) es el nuevo.
    let keyHolders = c.keyHolders;
    if (s) { keyHolders = Array.isArray(s.keyHolders) ? s.keyHolders : (s.keyHolder ? [s.keyHolder] : []); }
    result[id] = {
      ...c,
      status: s ? s.status : c.status,
      keyHolders,
      pendingRequest: pr,
      clean: s ? !!s.clean : c.clean,
      anomalies: s && s.anomalies ? s.anomalies : c.anomalies,
    };
  });
  return result;
}

// Corrige cualquier dato que haya quedado con una forma rara (ej: algo que debería ser una lista y no lo es).
// Si detecta algo raro, lo arregla localmente y avisa para que boot() lo vuelva a guardar ya reparado.
// las catedras cargadas antes de la version 1.10.0 no tenian "id" propio -> tocarlas no hacia nada
// (la busqueda por id fallaba en silencio). Esto les asigna uno estable la primera vez que se detectan.
function ensureCatedraIds(list) {
  let changed = false;
  const result = (list || []).map(c => {
    if (typeof c === "string") return c; // las de solo texto usan su propio texto como id, no necesitan nada mas
    if (c && c.id) return c;
    changed = true;
    return { ...c, id: `cat-legacy-${now()}-${Math.random().toString(36).slice(2,6)}` };
  });
  return { result, changed };
}

function sanitizeState(raw) {
  let repaired = false;
  let doors = (raw.doors && typeof raw.doors === "object" && !Array.isArray(raw.doors)) ? { ...raw.doors } : {};
  if (!raw.doors || typeof raw.doors !== "object" || Array.isArray(raw.doors)) repaired = true;
  Object.keys(doors).forEach(id => {
    const d = doors[id];
    if (!d || typeof d !== "object") { delete doors[id]; repaired = true; return; }
    if (d.pendingRequest && (typeof d.pendingRequest !== "object" || Array.isArray(d.pendingRequest) || !d.pendingRequest.type)) { doors[id] = { ...d, pendingRequest: null }; repaired = true; }
    if (!Array.isArray(d.anomalies)) { doors[id] = { ...doors[id], anomalies: [] }; repaired = true; }
  });
  let staff = (raw.staff && typeof raw.staff === "object" && !Array.isArray(raw.staff)) ? raw.staff : {};
  if (!raw.staff || typeof raw.staff !== "object" || Array.isArray(raw.staff)) repaired = true;
  let history = Array.isArray(raw.history) ? raw.history.filter(h => h && typeof h === "object" && h.doorId) : [];
  if (!Array.isArray(raw.history)) repaired = true;
  let catedras = Array.isArray(raw.catedras) ? raw.catedras.filter(c => typeof c === "string" || (c && typeof c === "object" && typeof c.name === "string")) : [];
  if (!Array.isArray(raw.catedras)) repaired = true;
  let notes = Array.isArray(raw.notes) ? raw.notes.filter(n => n && typeof n === "object" && n.text) : [];
  if (!Array.isArray(raw.notes)) repaired = true;
  return { sane: { doors, staff, history, catedras, notes }, repaired };
}

const SESSION_KEY = "fadu-session";
function saveSession(name) { try { localStorage.setItem(SESSION_KEY, JSON.stringify({ name, ts: Date.now() })); } catch(e){} }
function loadSessionName() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Date.now() - s.ts > 24 * 60 * 60 * 1000) return null;
    return s.name;
  } catch (e) { return null; }
}
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e){} }

async function boot() {
  const snap = await getDoc(STATE_DOC);
  let needsRepair = false;
  if (!snap.exists()) {
    data = EMPTY_STATE();
    await setDoc(STATE_DOC, JSON.parse(JSON.stringify(data)));
  } else {
    const raw = snap.data();
    const { sane, repaired } = sanitizeState(raw);
    const { result: catedras, changed: catChanged } = ensureCatedraIds(sane.catedras);
    needsRepair = repaired || catChanged;
    data = { doors: reconcileDoors(sane.doors), staff: sane.staff, history: sane.history, catedras, notes: sane.notes };
  }
  loaded = true;
  if (needsRepair) {
    try { await setDoc(STATE_DOC, JSON.parse(JSON.stringify(data))); } catch (e) {}
  }
  const savedName = loadSessionName();
  if (savedName && data.staff[savedName]) { loginAs(savedName, data.staff[savedName]); }
  else { render(); }
  onSnapshot(STATE_DOC, (snap) => {
    if (!snap.exists()) return;
    const raw = snap.data();
    const { sane, repaired } = sanitizeState(raw);
    const { result: catedras, changed: catChanged } = ensureCatedraIds(sane.catedras);
    data = { doors: reconcileDoors(sane.doors), staff: sane.staff, history: sane.history, catedras, notes: sane.notes };
    render();
    if (repaired || catChanged) { try { setDoc(STATE_DOC, JSON.parse(JSON.stringify(data))); } catch (e) {} }
  });
}

function loginAs(name, s) {
  user = { name, role: s.role, zones: s.zones || [], turnos: staffTurnos(s), permisosExtra: s.permisosExtra || [] };
  saveSession(name);
  if (typeof Notification === "undefined") {
    saveStaff(name, { notifStatus: "unsupported" });
  } else if (Notification.permission === "default") {
    Notification.requestPermission().then(result => { saveStaff(name, { notifStatus: result }); if (result === "granted") initPush(name); }).catch(()=>{});
  } else {
    saveStaff(name, { notifStatus: Notification.permission });
    if (Notification.permission === "granted") initPush(name);
  }
  startNoteChecker();
  document.getElementById("view-login").classList.add("hidden");
  document.getElementById("view-app").classList.remove("hidden");
  document.getElementById("tabs-nav").classList.remove("hidden");
  document.getElementById("tab-btn-personal").classList.toggle("hidden", user.role !== "jefe" && !isSuperuser(user));
  document.getElementById("user-sub").textContent = `${user.name} · ${user.role==="jefe"?"Oficina Seguridad":"Pisos"}`;
  const shiftBtn = document.getElementById("btn-shift-action");
  if (user.role === "recorrido") {
    shiftBtn.textContent = "Abandonar turno";
    shiftBtn.classList.remove("hidden");
    shiftBtn.onclick = async () => {
      if (!confirm("¿Confirmás que querés abandonar tu turno? Se te van a desasignar todos tus pisos y vas a dejar de recibir avisos hasta que un jefe te vuelva a asignar.")) return;
      await unassignZonesFor([user.name]);
      user.zones = [];
    };
  } else if (user.role === "jefe") {
    shiftBtn.textContent = "Desasignar Pisos";
    shiftBtn.classList.remove("hidden");
    shiftBtn.onclick = async () => {
      const names = Object.keys(data.staff).filter(n => data.staff[n].role === "recorrido" && (data.staff[n].zones||[]).length);
      if (!names.length) { alert("No hay nadie de Pisos con pisos asignados ahora mismo."); return; }
      if (!confirm(`¿Desasignar los pisos de las ${names.length} persona(s) de Pisos que los tienen asignados? Van a dejar de recibir avisos hasta que se les vuelva a asignar.`)) return;
      await unassignZonesFor(names);
    };
  } else {
    shiftBtn.classList.add("hidden");
  }
  render();
  checkVersionPopup();
}
document.getElementById("btn-logout").onclick = async () => {
  if (user && user.role === "jefe") {
    const names = Object.keys(data.staff).filter(n => data.staff[n].role === "recorrido" && (data.staff[n].zones||[]).length);

    }
  }
  clearSession(); location.reload();
};

function saveStaff(name, fields) { update(prev => ({ ...prev, staff: { ...prev.staff, [name]: { ...(prev.staff[name]||{}), ...fields } } })); }
// desasigna los pisos de varias personas de una sola vez, en un solo guardado — se puede esperar
// (await) a que termine, por ejemplo antes de cerrar sesión, para no cortar el guardado a mitad de camino.
async function unassignZonesFor(names) {

function deleteStaff(name) { update(prev => { const s = {...prev.staff}; delete s[name]; return {...prev, staff:s}; }); }
function addCatedra(cObj) {
  update(prev => {
    const list = prev.catedras || [];
    const withId = { id: `cat-${now()}-${Math.random().toString(36).slice(2,6)}`, ...cObj };
    return { ...prev, catedras: [...list, withId] };

}
function removeCatedra(id) { update(prev => ({ ...prev, catedras: (prev.catedras||[]).filter(c=>catedraId(c)!==id) })); }
function renameCatedra(id, fields) {
  update(prev => {
    const old = (prev.catedras||[]).find(c => catedraId(c)===id);
    const oldLabel = old ? catedraLabel(old) : null;
    const newLabel = fields.materia ? `${fields.name} - ${fields.materia}` : fields.name;
    const catedras = (prev.catedras||[]).map(c => catedraId(c)===id ? { ...c, ...fields, id } : c);
    const doors = { ...prev.doors };
    if (oldLabel && oldLabel !== newLabel) {
      Object.keys(doors).forEach(did => { if (doors[did].pendingRequest && doors[did].pendingRequest.catedra===oldLabel) doors[did] = { ...doors[did], pendingRequest: { ...doors[did].pendingRequest, catedra:newLabel } }; });
    }
    const history = (oldLabel && oldLabel !== newLabel) ? prev.history.map(h => h.catedra===oldLabel ? {...h, catedra:newLabel} : h) : prev.history;
    return { ...prev, catedras, doors, history };
  });
}
// una catedra vieja podia ser solo texto, o un objeto con "turno" (singular). Estas funciones
// entienden los 3 formatos para no perder nada de lo ya cargado.
function catedraId(c) { return typeof c === "string" ? c : (c.id || catedraLabel(c)); }
function catedraName(c) { return typeof c === "string" ? c : c.name; }
function catedraMateria(c) { return typeof c === "string" ? null : (c.materia || null); }
// una catedra puede tener varias aulas asociadas. Las viejas tenian una sola ("aula"); las nuevas
// tienen una lista ("aulas"). Esto entiende los dos formatos para no perder nada de lo ya cargado.
function catedraAulas(c) {
  if (typeof c === "string") return [];

}

// "test" es la unica cuenta que puede otorgar o quitar permisos especiales a cualquiera, propios o ajenos.
const SUPERUSER_NAME = "test";
// lista de capacidades que se pueden otorgar. Se modelan como lista (permisosExtra: ["gestionCatedras"]),
// no como campos sueltos, para poder sumar capacidades nuevas sin rediseñar nada.
const CAPABILITIES = [
  { id: "gestionCatedras", label: "Gestionar el catálogo general de cátedras (crear, editar, borrar para todos)" },
];
function isSuperuser(u) { return !!(u && u.name && u.name.toLowerCase() === SUPERUSER_NAME); }
// personal de "Pisos" (recorrido) asignado a un sector, para elegir quien tiene la llave al marcar
function pisosStaffForSector(sectorId) {

}
function hasPermission(u, cap) {
  if (!u) return false;
  if (isSuperuser(u)) return true; // el superusuario puede todo, sin necesidad de otorgarselo
  // se chequea contra el dato mas fresco (no la copia que se guardo en el momento del login),
  // asi un permiso otorgado por el superusuario aplica al toque, sin que haga falta reingresar.
  const live = data && data.staff && data.staff[u.name];
  const perms = (live && live.permisosExtra) || u.permisosExtra || [];
  return perms.includes(cap);
}

// las catedras sin turno/dia cargado siguen mostrandose siempre (compatibilidad con lo ya cargado).
// las que sí tienen turno, solo se muestran si algún turno coincide con los de quien pide (o si quien
// pide no tiene ningún turno cargado, en cuyo caso se muestran todas para no ocultar nada por error).
function catedrasForToday(doorId) {
  const list = data.catedras || [];
  const today = new Date().getDay();
  const myTurnos = (user && user.turnos) || [];
  return list.filter(c => {
    const turnos = catedraTurnos(c), dias = catedraDias(c), aulas = catedraAulas(c);
    const turnoOk = !turnos.length || !myTurnos.length || turnos.some(t => myTurnos.includes(t));
    const diaOk = !dias.length || dias.includes(today);
    const aulaOk = !aulas.length || !doorId || aulas.includes(doorId);
    return turnoOk && diaOk && aulaOk;
  });
}
function addNote(note) { update(prev => ({ ...prev, notes: [{ id:`note-${now()}`, createdBy:user.name, createdAt:now(), doorIds: note.doorIds||[], dismissedOccurrences: [], ...note }, ...(prev.notes||[])] })); }
function deleteNote(id) { update(prev => ({ ...prev, notes: (prev.notes||[]).filter(n=>n.id!==id) })); }
function dismissNote(id, occurrenceKey) {
  update(prev => ({ ...prev, notes: (prev.notes||[]).map(n => n.id===id ? { ...n, dismissedOccurrences: [...(n.dismissedOccurrences||[]), occurrenceKey] } : n) }));
}

function todayDateStr(d) { return (d||new Date()).toISOString().slice(0,10); }
function occurrenceKeyFor(note, dateStr) { return note.recurrence === "semanal" ? `${note.id}|${dateStr}` : note.id; }
function isNoteActiveNow(note, d) {
  const dow = d.getDay();
  if (note.recurrence === "semanal" && !(note.daysOfWeek||[]).includes(dow)) return false;
  if (note.time) {
    const [hh, mm] = note.time.split(":").map(Number);
    const target = new Date(d); target.setHours(hh, mm - 30, 0, 0);
    if (d < target) return false;
  }
  const key = occurrenceKeyFor(note, todayDateStr(d));
  if ((note.dismissedOccurrences||[]).includes(key)) return false;
  return true;
}

function confirmIfAlreadyInState(doorsArr, status) {
  const already = doorsArr.filter(d => d.status === status && !d.pendingRequest);
  if (already.length === 0) return true;
  const accion = status === "open" ? "abierta" : "cerrada";
  const pedir = status === "open" ? "apertura" : "cierre";
  if (already.length === 1) return confirm(`${already[0].label} ya está ${accion}. ¿Igual querés pedir la ${pedir}?`);
  return confirm(`${already.length} de las aulas seleccionadas ya están ${accion}s. ¿Igual querés pedir la ${pedir}?`);
}

function confirmIfMismatch(doorsArr, status) {
  const mismatched = doorsArr.filter(d => d.pendingRequest && d.pendingRequest.type !== status);
  if (mismatched.length === 0) return true;
  const pedido = status === "open" ? "cerrar" : "abrir";
  const accion = status === "open" ? "abierta" : "cerrada";
  if (mismatched.length === 1) return confirm(`Solicitaron ${pedido} ${mismatched[0].label}. ¿Está seguro que quiere marcarla ${accion}?`);
  return confirm(`${mismatched.length} de las puertas seleccionadas tienen pedido para ${pedido}. ¿Está seguro que quiere marcarlas ${accion}?`);
}

function bindPlates(root) {

/* ---------- render principal ---------- */
// si el usuario tiene el foco en un campo (escribiendo, tocando un chip) DENTRO del contenedor dado,
// no hay que regenerar ese contenedor por una actualización de datos que llega de otro lado — sino,
// se le borra lo que estaba completando (esto le pasaba a Bedelia cargando cátedras, o al cargar una
// nota, si alguien más marcaba una puerta mientras tanto).
function isEditingWithin(containerId) {
  const el = document.activeElement;
  if (!el || el === document.body) return false;
  if (!["INPUT","TEXTAREA","SELECT"].includes(el.tagName)) return false;
  const container = document.getElementById(containerId);
  return !!(container && container.contains(el));
}

function render() {
  if (!loaded) return;
  if (!user) { renderLogin(); return; }

  checkPendingNotifications();
  const allDoors = Object.values(data.doors);
  const pendingList = allDoors.filter(d=>d.pendingRequest).sort((a,b)=>a.pendingRequest.requestedAt-b.pendingRequest.requestedAt);
  document.getElementById("badge-label").textContent = pendingList.length ? `Solicitudes (${pendingList.length})` : "Solicitudes";
  document.getElementById("tabs-nav").classList.toggle("hidden", selectionMode);
  document.getElementById("user-sub").textContent = `${user.name} · ${user.role==="jefe"?"Oficina Seguridad":"Pisos"} ${saving?"· guardando…":""}`;

  const root = document.getElementById("content-root");
  root.style.paddingBottom = selectionMode ? "230px" : "76px";
  if (!isEditingWithin("content-root")) {
    if (tab==="inicio") root.innerHTML = renderInicio(allDoors, pendingList);
    if (tab==="sectores") root.innerHTML = renderSectores(allDoors);
    if (tab==="solicitudes") root.innerHTML = renderSolicitudes(pendingList);
    if (tab==="historial") root.innerHTML = renderHistorial();
    if (tab==="personal" && (user.role==="jefe" || isSuperuser(user))) root.innerHTML = renderPersonal();
    bindTabHandlers(root);
    bindPlates(root);
  }

  renderSelectionBar(pendingList);
  renderDoorDetail();
}

/* ---------- Inicio ---------- */
function renderInicio(allDoors, pendingList) {
  const myZones = user.zones || [];
  const doorsForStats = allDoors.filter(d => !d.excludeFromStats);
  const openCount = doorsForStats.filter(d=>d.status==="open").length;
  const closedCount = doorsForStats.filter(d=>d.status==="closed").length;
  const delayedCount = pendingList.filter(d=>now()-d.pendingRequest.requestedAt>DELAY_MS).length;
  const doorsWithAnomalies = allDoors.filter(d => (d.anomalies||[]).some(a=>!a.resolved));
  const myPending = pendingList.filter(d => myZones.includes(d.sector));
  const today = new Date().getDay();
  const notes = [...(data.notes||[])].sort((a,b)=>b.createdAt-a.createdAt);

  let html = "";
  if (user.role==="recorrido" && myPending.length) {
    html += myPending.map(d => `<button data-door="${d.id}" class="card" style="display:flex;gap:10px;align-items:center;width:100%;margin-bottom:8px;background:${d.pendingRequest.type==="open"?"var(--green-soft)":"var(--red-soft)"};border-color:${d.pendingRequest.type==="open"?"var(--green)":"var(--red)"};text-align:left;">
        <span class="dot ${d.pendingRequest.type==="open"?"pg":"pr"}" style="background:${d.pendingRequest.type==="open"?"var(--green)":"var(--red)"};width:12px;height:12px;"></span>
        <div><p style="font-size:14px;font-weight:700;margin:0;">${esc(d.pendingRequest.requestedBy)} pide ${d.pendingRequest.type==="open"?"ABRIR":"CERRAR"} ${esc(d.label)}${d.pendingRequest.catedra?` · Cátedra ${esc(d.pendingRequest.catedra)}`:""}</p>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">${elapsed(d.pendingRequest.requestedAt)}</p></div></button>`).join("");
  }

  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <p class="display" style="font-size:18px;font-weight:700;margin:0;">Notas</p>
      <div style="display:flex;gap:10px;">
        <button id="see-all-notes" style="font-size:12px;font-weight:600;color:var(--brass);">Ver todas</button>
        <button id="toggle-note-form" style="font-size:12px;font-weight:600;color:var(--brass);">+ Agregar</button>
      </div>
    </div>
    <div id="note-form-root"></div>`;
  const nowD = new Date();
  const activeNotes = notes.filter(n => isNoteActiveNow(n, nowD));
  if (!activeNotes.length) html += `<p style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">No hay notas activas ahora mismo.</p>`;
  else {
    html += `<div style="margin-bottom:20px;">` + activeNotes.map(n => `
      <div class="card" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <p style="font-size:13px;font-weight:600;margin:0;">${esc(n.text)}</p>
          <button data-close-note="${n.id}" style="color:var(--ink-soft);font-size:11px;font-weight:600;white-space:nowrap;">Cerrar ✕</button>
        </div>
        ${n.doorIds && n.doorIds.length ? `<p style="font-size:11px;color:var(--brass);font-weight:600;margin:2px 0 0;">Aulas: ${n.doorIds.map(id=>data.doors[id]?.label||id).join(", ")}</p>` : ""}
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">${n.recurrence==="semanal"?`Todos los ${(n.daysOfWeek||[]).map(v=>DIAS[v]).join(", ")}`:"Una vez"}${n.time?` · ${n.time} hs`:""} · cargó ${esc(n.createdBy)}</p>
      </div>`).join("") + `</div>`;
  }

  html += `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Resumen</p>
    <div class="grid2" style="margin-bottom:12px;">
      <button data-filter="abiertas" class="card" style="text-align:left;${filterInicio==='abiertas'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--green);margin:0;">${openCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Puertas abiertas</p></button>
      <button data-filter="cerradas" class="card" style="text-align:left;${filterInicio==='cerradas'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--red);margin:0;">${closedCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Puertas cerradas</p></button>
      <button data-filter="solicitudes" class="card" style="text-align:left;${filterInicio==='solicitudes'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;margin:0;">${pendingList.length}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Solicitudes</p></button>
      <button data-filter="demoradas" class="card" style="text-align:left;${filterInicio==='demoradas'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--red);margin:0;">${delayedCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Demoradas</p></button>
      <button data-filter="anomalias" class="card" style="text-align:left;${filterInicio==='anomalias'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--red);margin:0;">${doorsWithAnomalies.length}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Anomalías</p></button>
    </div>`;

  if (filterInicio) {
    const labels = { abiertas:"Puertas abiertas", cerradas:"Puertas cerradas", solicitudes:"Solicitudes pendientes", demoradas:"Solicitudes demoradas", anomalias:"Con anomalías" };
    let list = [];
    if (filterInicio==="abiertas") list = doorsForStats.filter(d=>d.status==="open");
    else if (filterInicio==="cerradas") list = doorsForStats.filter(d=>d.status==="closed");
    else if (filterInicio==="solicitudes") list = pendingList;
    else if (filterInicio==="demoradas") list = pendingList.filter(d=>now()-d.pendingRequest.requestedAt>DELAY_MS);
    else if (filterInicio==="anomalias") list = doorsWithAnomalies;
    html += `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">${labels[filterInicio].toUpperCase()} (${list.length})</p>`;
    if (!list.length) html += `<p style="font-size:13px;color:var(--ink-soft);">No hay ninguna en esta categoría.</p>`;
    html += list.map(d => `<button data-door="${d.id}" class="row-btn">
        <span style="font-size:13px;">${esc(d.label)} <span style="color:var(--ink-soft);">· ${esc(d.sectorLabel)}</span></span>
        <span style="font-size:11px;color:${filterInicio==="anomalias" ? "var(--red)" : "var(--ink-soft)"};font-weight:${filterInicio==="anomalias"?600:400};">${filterInicio==="anomalias" ? d.anomalies.filter(a=>!a.resolved).map(a=>esc(a.text)).join(", ") : d.pendingRequest ? `${d.pendingRequest.type==="open"?"piden abrir":"piden cerrar"}${d.pendingRequest.catedra?` · Cát. ${esc(d.pendingRequest.catedra)}`:""} · ${elapsed(d.pendingRequest.requestedAt)}` : (d.status==="open"?"abierta":"cerrada")}</span>
      </button>`).join("");
  }

  if (user.role==="recorrido") {
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 2px;">
        <p class="display" style="font-size:18px;font-weight:700;margin:0;">${myZones.length?"Mis sectores":"Sin sector asignado"}</p>
        <button data-goto="sectores" style="font-size:12px;font-weight:600;color:var(--brass);">Ver todos ▦</button>
      </div>`;
    if (myZones.length) {
      html += `<p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Mantené presionada un aula para seleccionar varias juntas.</p>`;
      myZones.forEach(zoneId => {
        const zoneLabel = ZONES.find(z=>z.id===zoneId)?.label;
        const doorsInZone = allDoors.filter(d=>d.sector===zoneId);
        const zoneAnomaly = doorsInZone.some(d => (d.anomalies||[]).some(a=>!a.resolved));
        html += `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">${zoneLabel?.toUpperCase()}${zoneAnomaly?' ⚠️':''}</p><div class="grid4" style="margin-bottom:20px;">${doorsInZone.map(plateHTML).join("")}</div>`;
      });
    } else html += `<p style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;">Todavía no tenés un piso asignado por la oficina de seguridad.</p>`;
  } else if (pendingList.length) {
    html += `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Solicitudes en curso</p>` +
      pendingList.slice(0,5).map(d=>`<button data-door="${d.id}" class="row-btn"><span style="font-size:13px;">${esc(d.label)} · ${d.pendingRequest.type==="open"?"abrir":"cerrar"}${d.pendingRequest.catedra?` · Cát. ${esc(d.pendingRequest.catedra)}`:""}</span><span style="font-size:11px;color:var(--ink-soft);">${elapsed(d.pendingRequest.requestedAt)}</span></button>`).join("");
  }
  return html;
}

/* ---------- Sectores ---------- */
function renderSectores(allDoors) {
  const shown = allDoors.filter(d=>d.sector===activeSector && (!sectorStatusFilter || d.status===sectorStatusFilter));
  const sectorHasAnomaly = (zoneId) => allDoors.some(d => d.sector===zoneId && (d.anomalies||[]).some(a=>!a.resolved));
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      ${ZONES.map(z=>`<button class="chip sector-pick ${activeSector===z.id?"active":""}" data-zone="${z.id}" style="font-size:11px;padding:6px 10px;">${z.label}${sectorHasAnomaly(z.id)?' ⚠️':''}</button>`).join("")}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button id="filter-open-toggle" class="chip" style="${sectorStatusFilter==="open"?"border-color:var(--green);background:var(--green-soft);":""}">🚪 Solo abiertas ${sectorStatusFilter==="open"?`(${shown.length})`:""}</button>
      <button id="filter-closed-toggle" class="chip" style="${sectorStatusFilter==="closed"?"border-color:var(--red);background:var(--red-soft);":""}">🚪 Solo cerradas ${sectorStatusFilter==="closed"?`(${shown.length})`:""}</button>
    </div>
    ${sectorHasAnomaly(activeSector) ? `<p style="font-size:11px;color:var(--red);font-weight:600;margin-bottom:10px;">⚠️ Hay al menos una anomalía sin resolver en este sector.</p>` : ""}
    <p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Mantené presionada un aula para seleccionar varias juntas.</p>
    ${!shown.length ? `<p style="font-size:13px;color:var(--ink-soft);">No hay ninguna en este sector con ese filtro.</p>` : ""}
    <div class="grid4">${shown.map(plateHTML).join("")}</div>
    <div style="margin-top:20px;padding-top:12px;border-top:1px solid #E4DECB;display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:var(--ink-soft);">
      <span>📺 tiene TV</span>
      <span>✅ cerrada y limpia</span>
      <span>⚠️ anomalía sin resolver</span>
      <span>📝 tiene notas</span>
      <span>🔴/🟢 parpadeo = piden cerrar/abrir</span>
    </div>`;
}

/* ---------- Solicitudes ---------- */
function renderSolicitudes(pendingList) {
  if (!pendingList.length) return `<p style="text-align:center;color:var(--ink-soft);padding:40px 0;font-size:13px;">No hay solicitudes pendientes.</p>`;
  return `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Solicitudes pendientes</p>` +
    pendingList.map(d => {
      const delayed = now()-d.pendingRequest.requestedAt>DELAY_MS;
      return `<button data-door="${d.id}" class="card" style="display:flex;justify-content:space-between;width:100%;margin-bottom:8px;background:${d.pendingRequest.type==="open"?"var(--green-soft)":"var(--red-soft)"};text-align:left;">
        <div><p style="font-size:14px;font-weight:700;margin:0;">${esc(d.label)} · ${d.pendingRequest.type==="open"?"ABRIR":"CERRAR"}</p>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">pidió ${esc(d.pendingRequest.requestedBy)}${d.pendingRequest.catedra?` (Cátedra ${esc(d.pendingRequest.catedra)})`:""} · ${esc(d.sectorLabel)}</p></div>
        <span style="font-size:11px;color:${delayed?"var(--red)":"var(--ink-soft)"};font-weight:${delayed?700:400};align-self:center;">${delayed?"¡demorada! ":""}${elapsed(d.pendingRequest.requestedAt)}</span></button>`;
    }).join("");
}

/* ---------- Historial ---------- */
function renderHistorial() {
  const all = [...data.history].sort((a,b) => b.executedAt - a.executedAt);
  const filtered = historialFilter ? all.filter(x => x.doorLabel.toLowerCase().includes(historialFilter.toLowerCase())) : all;
  const searchBox = `<div style="margin-bottom:12px;">
      <input id="historial-search" value="${esc(historialFilter)}" placeholder="Filtrar por aula (ej: 106, EP110, S)" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:9px 12px;font-size:13px;" />
    </div>`;
  if (!all.length) return `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Historial</p>` + searchBox + `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">Todavía no hay movimientos registrados.</p>`;
  return `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Historial</p>` + searchBox +
    (!filtered.length ? `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">Ningún movimiento coincide con "${esc(historialFilter)}".</p>` : "") +
    filtered.map(x => `<div style="padding:8px 0;border-bottom:1px solid #E4DECB;">
      <div style="display:flex;justify-content:space-between;"><span style="font-size:14px;font-weight:600;">${esc(x.doorLabel)} · ${x.action==="open"?"Abierta":"Cerrada"}</span></div>
      <p style="font-size:12px;color:var(--ink-soft);margin:2px 0 0;">${x.requestedBy?`pidió ${esc(x.requestedBy)} a las ${fmtTime(x.requestedAt)}${x.catedra?` (Cátedra ${esc(x.catedra)})`:""}`:"📻 sin solicitud (handy)"}</p>
      <p style="font-size:12px;color:var(--ink-soft);margin:1px 0 0;">ejecutó ${esc(x.executedBy)} a las ${fmtTime(x.executedAt)}</p>
    </div>`).join("");
}

function bindHistorialSearch(root) {
  const inp = document.getElementById("historial-search");
  if (!inp) return;
  inp.oninput = (e) => {
    const pos = e.target.selectionStart;
    historialFilter = e.target.value;
    root.innerHTML = renderHistorial();
    bindHistorialSearch(root);
    const newInp = document.getElementById("historial-search");
    newInp.focus();
    newInp.setSelectionRange(pos, pos);
  };
}

/* ---------- Personal ---------- */
function renderPersonal() {
  const names = Object.keys(data.staff);
  const catedras = data.catedras || [];
  const canManageCatedras = hasPermission(user, "gestionCatedras");
  const catedrasBlock = canManageCatedras ? `
      <div class="card" style="margin-bottom:14px;">
        <div style="position:relative;margin-bottom:8px;">

          <div id="new-catedra-input-sug" class="hidden" style="position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #D8CFB8;border-radius:8px;max-height:160px;overflow-y:auto;z-index:5;margin-top:2px;"></div>

        <div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px;">
          ${["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map((l,i)=>`<button data-newcat-day="${i}" class="chip newcat-day" style="font-size:11px;padding:5px 9px;">${l}</button>`).join("")}
        </div>
        <button id="new-catedra-btn" class="btn-primary" disabled>+ Agregar cátedra</button>
      </div>
      ${catedras.length > 5 ? `<input id="catedra-search" placeholder="🔍 Buscar cátedra por nombre, materia o aula..." style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:10px;" />` : ""}
      ${!catedras.length ? `<p style="font-size:13px;color:var(--ink-soft);">Todavía no cargaste ninguna cátedra.</p>` : `<div id="catedra-chip-list" style="display:flex;flex-wrap:wrap;gap:8px;">${catedras.map(c=>{
        const turnos = catedraTurnos(c), dias = catedraDias(c), aulas = catedraAulas(c);
        const turnoIcons = turnos.map(t=>({manana:"☀️",tarde:"🌤️",noche:"🌙"}[t])).join("");
        const diasTxt = dias.length ? dias.map(d=>["D","L","M","X","J","V","S"][d]).join("") : "";
        const aulasTxt = aulas.length ? ` (${aulas.map(a=>esc(aulaLabel(a))).join(", ")})` : "";
        const searchTxt = esc(`${catedraLabel(c)} ${aulas.map(a=>aulaLabel(a)).join(" ")}`.toLowerCase());
        return `<button class="chip catedra-chip" data-search="${searchTxt}" data-edit-catedra="${esc(catedraId(c))}">✎ ${esc(catedraLabel(c))}${aulasTxt}${turnoIcons?` ${turnoIcons}`:""}${diasTxt?` ${diasTxt}`:""}</button>`;
      }).join("")}</div>`}` : `
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">No tenés permiso para gestionar el catálogo general de cátedras. Podés cargar una cátedra puntual al pedir apertura/cierre — queda guardada solo en ese pedido.</p>
      ${catedras.length > 5 ? `<input id="catedra-search" placeholder="🔍 Buscar cátedra por nombre, materia o aula..." style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:10px;" />` : ""}
      ${!catedras.length ? "" : `<div id="catedra-chip-list" style="display:flex;flex-wrap:wrap;gap:8px;">${catedras.map(c=>{
        const aulas = catedraAulas(c);
        const searchTxt = esc(`${catedraLabel(c)} ${aulas.map(a=>aulaLabel(a)).join(" ")}`.toLowerCase());
        return `<span class="chip catedra-chip" data-search="${searchTxt}" style="opacity:.7;">${esc(catedraLabel(c))}</span>`;
      }).join("")}</div>`}`;

      <p class="display" style="font-size:18px;font-weight:700;margin-bottom:6px;">Permisos</p>

      ${!names.length ? `<p style="font-size:13px;color:var(--ink-soft);">Todavía no hay nadie cargado.</p>` : names.map(n => `
        <div class="card" style="margin-bottom:8px;">
          <p style="font-size:13px;font-weight:600;margin:0 0 6px;">${esc(n)}</p>
          ${CAPABILITIES.map(cap => `<label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;">

  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
      <p class="display" style="font-size:18px;font-weight:700;margin:0;">Personal</p>
      <button id="add-staff-btn" style="background:var(--ink);color:#F7F4EC;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;">+ Agregar</button>
    </div>
    <p style="font-size:11px;color:var(--ink-soft);margin-bottom:12px;">Tocá a una persona para cambiarle los pisos o el rol.</p>
    ${!names.length ? `<p style="font-size:13px;color:var(--ink-soft);">Todavía no hay nadie cargado.</p>` : names.map(n => {
      const ns = data.staff[n].notifStatus;
      const notifIcon = ns==="granted" ? "🔔" : ns==="denied" ? "🔕" : ns==="unsupported" ? "" : "❔";

/* ---------- handlers por pestaña ---------- */
function bindTabHandlers(root) {
  if (tab==="inicio") {
    root.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filterInicio = filterInicio===b.dataset.filter?null:b.dataset.filter; render(); });
    root.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { tab = b.dataset.goto; document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active", x.dataset.tab===tab)); render(); });
    root.querySelectorAll("[data-close-note]").forEach(b => b.onclick = () => {
      const n = (data.notes||[]).find(x=>x.id===b.dataset.closeNote);
      if (n) dismissNote(n.id, occurrenceKeyFor(n, todayDateStr(new Date())));
    });
    const seeAllBtn = document.getElementById("see-all-notes");
    if (seeAllBtn) seeAllBtn.onclick = () => renderAllNotesSheet();
    const toggleBtn = document.getElementById("toggle-note-form");
    if (toggleBtn) toggleBtn.onclick = () => {
      const r = document.getElementById("note-form-root");
      if (r.innerHTML) { r.innerHTML = ""; return; }
      r.innerHTML = noteFormHTML();
      bindNoteForm(r, (note) => { addNote(note); r.innerHTML = ""; });
    };
  }
  if (tab==="sectores") {
    root.querySelectorAll(".sector-pick").forEach(b => b.onclick = () => { activeSector = b.dataset.zone; render(); });
    const openBtn = document.getElementById("filter-open-toggle");
    if (openBtn) openBtn.onclick = () => { sectorStatusFilter = sectorStatusFilter==="open" ? null : "open"; render(); };
    const closedBtn = document.getElementById("filter-closed-toggle");
    if (closedBtn) closedBtn.onclick = () => { sectorStatusFilter = sectorStatusFilter==="closed" ? null : "closed"; render(); };
  }
  if (tab==="historial") bindHistorialSearch(root);
  if (tab==="personal" && (user.role==="jefe" || isSuperuser(user))) {
    const addBtn = document.getElementById("add-staff-btn");
    if (addBtn) addBtn.onclick = () => openStaffSheet(null);
    root.querySelectorAll("[data-edit-staff]").forEach(b => b.onclick = () => openStaffSheet(b.dataset.editStaff));
    root.querySelectorAll("[data-edit-catedra]").forEach(b => b.onclick = () => openCatedraSheet(b.dataset.editCatedra));
    const catSearch = document.getElementById("catedra-search");
    if (catSearch) catSearch.oninput = () => {
      const q = catSearch.value.trim().toLowerCase();
      root.querySelectorAll(".catedra-chip").forEach(chip => {
        chip.style.display = (!q || (chip.dataset.search||"").includes(q)) ? "" : "none";
      });
    };
    const ci = document.getElementById("new-catedra-input"), cb = document.getElementById("new-catedra-btn");
    const cMateria = document.getElementById("new-catedra-materia");
    const aulasWidget = document.getElementById("new-catedra-aulas") ? bindMultiAulaPicker("new-catedra-aulas", []) : null;
    bindCatedraNameSuggest("new-catedra-input", "new-catedra-input-sug");
    if (cb) {
      let newCatTurnos = [], newCatDias = [];
      const check = () => cb.disabled = !ci.value.trim();
      ci.oninput = check;
      root.querySelectorAll(".newcat-turno").forEach(b => b.onclick = () => { const t = b.dataset.newcatTurno; newCatTurnos = newCatTurnos.includes(t) ? newCatTurnos.filter(x=>x!==t) : [...newCatTurnos, t]; b.classList.toggle("active", newCatTurnos.includes(t)); });
      root.querySelectorAll(".newcat-day").forEach(b => b.onclick = () => {
        const d = parseInt(b.dataset.newcatDay);
        newCatDias = newCatDias.includes(d) ? newCatDias.filter(x=>x!==d) : [...newCatDias, d].sort();
        b.classList.toggle("active", newCatDias.includes(d));
      });
      cb.onclick = () => {
        if (!ci.value.trim()) return;
        addCatedra({ name: ci.value.trim(), materia: cMateria.value.trim() || null, aulas: aulasWidget ? aulasWidget.getIds() : [], turnos: newCatTurnos, dias: newCatDias });
        ci.value = ""; cMateria.value = ""; newCatTurnos = []; newCatDias = [];
        root.querySelectorAll(".newcat-turno, .newcat-day").forEach(x=>x.classList.remove("active"));
        check();
      };
    }
    root.querySelectorAll(".perm-toggle").forEach(cbx => cbx.onchange = () => {
      const name = cbx.dataset.staff, cap = cbx.dataset.cap;
      const current = (data.staff[name] && data.staff[name].permisosExtra) || [];
      const next = cbx.checked ? [...new Set([...current, cap])] : current.filter(c => c !== cap);
      saveStaff(name, { permisosExtra: next });
    });
  }
}

function bindNoteForm(root, onSave) {
  let recurrence = "unica", daysOfWeek = [5];
  const textI = root.querySelector("#note-text"), saveBtn = root.querySelector("#note-save");
  const recU = root.querySelector("#note-rec-unica"), recS = root.querySelector("#note-rec-semanal"), daysWrap = root.querySelector("#note-days");
  const checkValid = () => saveBtn.disabled = !textI.value.trim() || (recurrence==="semanal" && daysOfWeek.length===0);
  textI.oninput = checkValid;
  recU.onclick = () => { recurrence="unica"; recU.classList.add("active"); recS.classList.remove("active"); daysWrap.classList.add("hidden"); checkValid(); };
  recS.onclick = () => { recurrence="semanal"; recS.classList.add("active"); recU.classList.remove("active"); daysWrap.classList.remove("hidden"); checkValid(); };
  root.querySelectorAll(".note-day").forEach(b => b.onclick = () => {
    const v = parseInt(b.dataset.day);
    if (daysOfWeek.includes(v)) { daysOfWeek = daysOfWeek.filter(x=>x!==v); b.style.background=""; b.textContent = DIAS_CORTO.find(d=>d.v===v).l; }
    else { daysOfWeek = [...daysOfWeek, v].sort(); b.style.background="var(--brass-soft)"; b.textContent = "✓ " + DIAS_CORTO.find(d=>d.v===v).l; }
    checkValid();
  });
  saveBtn.onclick = () => onSave({ text: textI.value.trim(), recurrence, daysOfWeek: recurrence==="semanal"?daysOfWeek:[], time: root.querySelector("#note-time").value || null });
}

    const id = name || nameI.value.trim();
    if (!name && data.staff[id]) { alert("Ya existe una persona con ese nombre."); return; }
    saveStaff(id, name ? { role, zones, turnos } : { role, zones, turnos, pin: null });
    close();
  };
  const delBtn = document.getElementById("staff-delete");
  if (delBtn) delBtn.onclick = () => { if (confirm(`¿Eliminar a ${name}?`)) { deleteStaff(name); close(); } };
}

function openCatedraSheet(id) {
  const existing = (data.catedras||[]).find(c => catedraId(c) === id);
  if (!existing) return;
  let turnos = catedraTurnos(existing);
  let dias = [...catedraDias(existing)];
  const root = document.getElementById("detail-root");
  root.innerHTML = `<div class="sheet" id="cat-sheet-bg"><div class="sheet-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">Editar cátedra</h2>
        <button id="cat-close" style="font-size:20px;">✕</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE</label>
      <div style="position:relative;margin:6px 0 10px;">
        <input id="cat-name" value="${esc(catedraName(existing))}" autocomplete="off" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;" />
        <div id="cat-name-sug" class="hidden" style="position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #D8CFB8;border-radius:8px;max-height:160px;overflow-y:auto;z-index:5;margin-top:2px;"></div>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">MATERIA (opcional)</label>
      <input id="cat-materia" value="${esc(catedraMateria(existing) || "")}" placeholder="Ej: Cálculo" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;margin:6px 0 10px;" />
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">AULAS HABITUALES (opcional, podés elegir varias)</label>
      ${multiAulaPickerHTML("cat-aulas")}
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:16px;">Los pedidos y el historial ya cargados con este nombre se actualizan solos si lo cambiás.</p>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">TURNO (podés elegir más de uno)</label>
      <div style="display:flex;gap:6px;margin:8px 0 16px;">
        <button data-cat-turno="manana" class="chip cat-turno ${turnos.includes('manana')?'active':''}" style="flex:1;font-size:12px;">☀️ Mañana</button>
        <button data-cat-turno="tarde" class="chip cat-turno ${turnos.includes('tarde')?'active':''}" style="flex:1;font-size:12px;">🌤️ Tarde</button>
        <button data-cat-turno="noche" class="chip cat-turno ${turnos.includes('noche')?'active':''}" style="flex:1;font-size:12px;">🌙 Noche</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">DÍAS</label>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 20px;">
        ${["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map((l,i)=>`<button data-cat-day="${i}" class="chip cat-day ${dias.includes(i)?'active':''}" style="font-size:11px;padding:5px 9px;">${l}</button>`).join("")}
      </div>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:16px;">Si dejás turno o días sin marcar, esta cátedra va a aparecer siempre, sin filtrar.</p>
      <button id="cat-save" class="btn-primary">Guardar cambios</button>
      <button id="cat-delete" style="width:100%;margin-top:10px;padding:12px;border-radius:8px;color:var(--red);font-weight:600;font-size:13px;border:1px solid var(--red-soft);">Eliminar cátedra</button>
    </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("cat-close").onclick = close;
  const aulasWidget = bindMultiAulaPicker("cat-aulas", catedraAulas(existing));
  bindCatedraNameSuggest("cat-name", "cat-name-sug");
  document.getElementById("cat-sheet-bg").onclick = (e) => { if (e.target.id==="cat-sheet-bg") close(); };
  root.querySelectorAll(".cat-turno").forEach(b => b.onclick = () => { const t = b.dataset.catTurno; turnos = turnos.includes(t) ? turnos.filter(x=>x!==t) : [...turnos, t]; b.classList.toggle("active", turnos.includes(t)); });
  root.querySelectorAll(".cat-day").forEach(b => b.onclick = () => {
    const d = parseInt(b.dataset.catDay);
    dias = dias.includes(d) ? dias.filter(x=>x!==d) : [...dias, d].sort();
    b.classList.toggle("active", dias.includes(d));
  });
  document.getElementById("cat-save").onclick = () => {
    const val = document.getElementById("cat-name").value.trim();
    const materia = document.getElementById("cat-materia").value.trim() || null;
    const aulas = aulasWidget.getIds();
    if (!val) return;
    renameCatedra(id, { name: val, materia, aulas, turnos, dias });
    close();
  };
  document.getElementById("cat-delete").onclick = () => { if (confirm(`¿Eliminar la cátedra ${catedraLabel(existing)}?`)) { removeCatedra(id); close(); } };
}

/* ---------- detalle de puerta ---------- */
let selectedCatedra = null, markCleanChecked = false, catedraDetailsOpen = false;
// estos ids son los fondos de las distintas "hojas" modales que se dibujan en #detail-root.
// si cualquiera de estas está abierta, renderDoorDetail no tiene que pisarla — sino, cualquier
// actualización de datos en tiempo real (de cualquier usuario, en cualquier parte de la app)
// las cerraba solas antes de que se llegaran a leer.
const OTHER_MODAL_IDS = ["all-notes-bg", "version-popup-bg", "full-changelog-bg", "staff-sheet-bg", "cat-sheet-bg", "note-sheet-bg"];
function renderDoorDetail() {
  const root = document.getElementById("detail-root");
  if (OTHER_MODAL_IDS.some(id => document.getElementById(id))) return;
  if (!selectedDoorId || !data.doors[selectedDoorId]) { if (!noteDraftIds) root.innerHTML = ""; return; }
  if (isEditingWithin("detail-root")) return; // no pisar el contenido mientras esta escribiendo/tocando adentro
  const d = data.doors[selectedDoorId];
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  const doorHist = data.history.filter(h=>h.doorId===d.id).sort((a,b)=>b.executedAt-a.executedAt).slice(0,5);
  const doorNotes = (data.notes||[]).filter(n => n.doorIds && n.doorIds.includes(d.id));
  const catedras = catedrasForToday(d.id);
  const totalCatedras = (data.catedras||[]).length;

  root.innerHTML = `<div class="sheet" id="sheet-bg"><div class="sheet-inner">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">${esc(d.label)}</h2>
      <button id="sheet-close" style="font-size:20px;">✕</button>
    </div>
    <p style="margin:0 0 4px;font-weight:600;">Estado actual: ${d.status==="open"?"Abierta 🟢":"Cerrada 🔴"}</p>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">🔑 ${(d.keyHolders&&d.keyHolders.length)?`Llave en poder de ${d.keyHolders.map(esc).join(", ")}`:"Sin nadie asignado a la llave"} · ${esc(d.sectorLabel)}</p>
    ${(() => {
      const catedrasDeEstaAula = (data.catedras||[]).filter(c => catedraAulas(c).includes(d.id));
      if (!catedrasDeEstaAula.length) return "";
      return `<div class="card" style="margin-bottom:16px;background:var(--brass-soft);">
        <p class="mono" style="font-size:10px;color:var(--ink-soft);margin:0 0 6px;">CÁTEDRAS QUE USAN ESTA AULA</p>
        ${catedrasDeEstaAula.map(c => {
          const turnoIcons = catedraTurnos(c).map(t=>({manana:"☀️",tarde:"🌤️",noche:"🌙"}[t])).join("");
          const dias = catedraDias(c);
          const diasTxt = dias.length ? dias.map(dd=>["D","L","M","X","J","V","S"][dd]).join("") : "todos los días";
          return `<p style="font-size:12px;margin:0 0 4px;">${esc(catedraLabel(c))} ${turnoIcons} <span style="color:var(--ink-soft);">(${diasTxt})</span></p>`;
        }).join("")}
      </div>`;
    })()}
    ${d.hasTV ? `<div class="card" style="margin-bottom:16px;background:#F1ECDD;"><p style="font-size:12px;margin:0;">📺 Tiene TV — extremar el cuidado al cerrar.</p></div>` : ""}
    ${d.status==="closed" && d.clean ? `<div class="card" style="margin-bottom:16px;background:var(--green-soft);"><p style="font-size:12px;margin:0;">✅ Quedó cerrada y limpia — limpieza no necesita revisarla.</p></div>` : ""}
    ${pr ? `<div class="card" style="margin-bottom:16px;background:${pr.type==="open"?"var(--green-soft)":"var(--red-soft)"};">
        <p style="font-weight:700;font-size:13px;margin:0 0 4px;">${delayed?"⚠️ ":"🔔 "}Piden ${pr.type==="open"?"ABRIR":"CERRAR"} ${delayed?"· demorada":""}</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:0;">Lo pidió ${esc(pr.requestedBy)} · ${elapsed(pr.requestedAt)}${pr.catedra?` · Cátedra ${esc(pr.catedra)}`:""}</p>
      </div>` : ""}
    ${user.role==="jefe" ? `
      <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">PEDIR AL PERSONAL DEL PISO</p>
      <p id="cat-selected-label" style="font-size:11px;color:var(--brass);font-weight:600;margin:0 0 8px;"></p>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button id="det-req-open" ${pr?.type==="open"?"disabled":""} style="flex:1;padding:10px;border-radius:6px;background:var(--green-soft);font-size:13px;font-weight:600;opacity:${pr?.type==="open"?0.5:1};">🚪 Pedir apertura</button>
        <button id="det-req-closed" ${pr?.type==="closed"?"disabled":""} style="flex:1;padding:10px;border-radius:6px;background:var(--red-soft);font-size:13px;font-weight:600;opacity:${pr?.type==="closed"?0.5:1};">🚪 Pedir cierre</button>
      </div>
      <details id="det-cat-details" style="margin-bottom:16px;" ${catedraDetailsOpen?"open":""}>
        <summary style="font-size:11px;color:var(--ink-soft);cursor:pointer;">¿De qué cátedra es? (opcional, tocá para elegir)</summary>
        <div style="margin-top:10px;">
          ${catedras.length ? `<div id="det-catedras" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">${catedras.map(c=>{ const aulas = catedraAulas(c); return `<button class="chip det-cat" data-cat="${esc(catedraLabel(c))}">${esc(catedraLabel(c))}${aulas.length?` (${aulas.map(a=>esc(aulaLabel(a))).join(", ")})`:""}</button>`; }).join("")}</div>` : ""}
          ${totalCatedras > catedras.length ? `<p style="font-size:10px;color:var(--ink-soft);margin:0 0 6px;">Hay ${totalCatedras - catedras.length} cátedra(s) más cargadas para otro turno/día — si es una de esas, escribila de nuevo abajo.</p>` : ""}
          <div style="position:relative;display:flex;gap:6px;margin-bottom:4px;">
            <div style="flex:1;position:relative;">
              <input id="new-cat-inline" placeholder="¿No está en la lista? Escribila acá" autocomplete="off" style="width:100%;border:1px solid #D8CFB8;border-radius:6px;padding:7px 10px;font-size:12px;" />
              <div id="new-cat-inline-sug" class="hidden" style="position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #D8CFB8;border-radius:6px;max-height:150px;overflow-y:auto;z-index:5;margin-top:2px;"></div>
            </div>
            <button id="new-cat-inline-btn" style="background:var(--ink);color:#F7F4EC;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;">+</button>
          </div>
          ${!hasPermission(user,"gestionCatedras") ? `<p style="font-size:10px;color:var(--ink-soft);margin:2px 0 0;">Esta cátedra queda guardada solo en este pedido, no se suma al catálogo general.</p>` : ""}
        </div>
      </details>` : ""}
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">YA LO HICE CON LA LLAVE — MARCAR</p>
    <p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Usalo también si te lo pidieron por handy, sin pasar por una solicitud del sistema.</p>
    <p style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">¿Quién tiene la llave? (opcional, podés elegir más de uno)</p>
    <div id="det-keyholders" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
      ${pisosStaffForSector(d.sector).length ? pisosStaffForSector(d.sector).map(n=>`<button type="button" class="chip det-kh" data-name="${esc(n)}">${esc(n)}</button>`).join("") : `<span style="font-size:11px;color:var(--ink-soft);">No hay nadie de Pisos asignado a este sector.</span>`}
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--ink-soft);">
      <input type="checkbox" id="det-clean" /> Quedó cerrada y limpia (limpieza no la necesita revisar)
    </label>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button id="det-mark-open" style="flex:1;padding:13px;border-radius:6px;background:var(--green);color:#fff;font-weight:700;font-size:14px;">✓ Abierta</button>
      <button id="det-mark-closed" style="flex:1;padding:13px;border-radius:6px;background:var(--red);color:#fff;font-weight:700;font-size:14px;">✓ Cerrada</button>
    </div>
    ${doorNotes.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">NOTAS DE ESTA AULA</p>` +
      doorNotes.map(n=>`<div class="card" style="margin-bottom:6px;background:var(--brass-soft);"><p style="font-size:12px;font-weight:600;margin:0;">${esc(n.text)}</p><p style="font-size:10px;color:var(--ink-soft);margin:2px 0 0;">${n.recurrence==="semanal"?"Todas las semanas":"Una vez"}${n.time?` · ${n.time} hs`:""}</p></div>`).join("") : ""}
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin:16px 0 6px;">ANOMALÍAS</p>
    ${(d.anomalies||[]).filter(a=>!a.resolved).map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;background:var(--red-soft);border-radius:6px;padding:8px;margin-bottom:6px;">
        <div><p style="font-size:12px;font-weight:700;color:var(--red);margin:0;">${esc(a.text)}</p><p style="font-size:10px;color:var(--ink-soft);margin:0;">${esc(a.reportedBy)} · ${elapsed(a.reportedAt)}</p></div>
        <button data-resolve="${a.id}" style="font-size:10px;font-weight:600;color:var(--green);white-space:nowrap;">✓ Resuelta</button>
      </div>`).join("")}
    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <input id="anomaly-text" placeholder="Ej: se quemaron 3 lamparitas" style="flex:1;border:1px solid #D8CFB8;border-radius:6px;padding:7px 10px;font-size:12px;" />
      <button id="anomaly-btn" style="background:var(--ink);color:#F7F4EC;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;">Reportar</button>
    </div>
    ${doorHist.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">ÚLTIMOS MOVIMIENTOS</p>` +
      doorHist.map(h=>`<div style="font-size:12px;border-top:1px solid #E4DECB;padding:6px 0;"><span style="font-weight:600;">${h.action==="open"?"Abierta":"Cerrada"}</span><span class="mono" style="color:var(--ink-soft);"> · ${fmtTime(h.executedAt)}</span><div style="color:var(--ink-soft);">${h.requestedBy?`pidió ${esc(h.requestedBy)}${h.catedra?` (Cátedra ${esc(h.catedra)})`:""} · `:"sin solicitud (handy) · "}ejecutó ${esc(h.executedBy)}</div></div>`).join("") : ""}
  </div></div>`;

  const close = () => { selectedDoorId = null; selectedCatedra = null; markCleanChecked = false; render(); };
  document.getElementById("sheet-close").onclick = close;
  document.getElementById("sheet-bg").onclick = (e) => { if (e.target.id==="sheet-bg") close(); };
  const catDetailsEl = document.getElementById("det-cat-details");
  if (catDetailsEl) catDetailsEl.addEventListener("toggle", () => { catedraDetailsOpen = catDetailsEl.open; });
  // preseleccionado: si quien marca es de Pisos y está en la lista de este sector, arranca tildado a sí mismo.
  let detKeyHolders = (user.role === "recorrido" && pisosStaffForSector(d.sector).includes(user.name)) ? [user.name] : [];
  root.querySelectorAll(".det-kh").forEach(b => {
    if (detKeyHolders.includes(b.dataset.name)) b.classList.add("active");
    b.onclick = () => {
      const n = b.dataset.name;
      detKeyHolders = detKeyHolders.includes(n) ? detKeyHolders.filter(x=>x!==n) : [...detKeyHolders, n];
      b.classList.toggle("active", detKeyHolders.includes(n));
    };
  });
  const markOpenBtn = document.getElementById("det-mark-open"), markClosedBtn = document.getElementById("det-mark-closed");
  if (markOpenBtn) markOpenBtn.onclick = () => { if (confirmIfMismatch([d], "open")) markDoor(d.id, "open", false, detKeyHolders); };
  if (markClosedBtn) markClosedBtn.onclick = () => { if (confirmIfMismatch([d], "closed")) markDoor(d.id, "closed", document.getElementById("det-clean").checked); };
  const ro = document.getElementById("det-req-open"), rc = document.getElementById("det-req-closed");
  if (ro) ro.onclick = () => { if (confirmIfAlreadyInState([d], "open")) requestChange(d.id, "open", selectedCatedra); };
  if (rc) rc.onclick = () => { if (confirmIfAlreadyInState([d], "closed")) requestChange(d.id, "closed", selectedCatedra); };
  root.querySelectorAll(".det-cat").forEach(b => b.onclick = () => {
    selectedCatedra = selectedCatedra===b.dataset.cat ? null : b.dataset.cat;
    root.querySelectorAll(".det-cat").forEach(x=>x.classList.toggle("active", x.dataset.cat===selectedCatedra));
    document.getElementById("cat-selected-label").textContent = selectedCatedra ? `Seleccionada: ${selectedCatedra}` : "";
  });
  const newCatI = document.getElementById("new-cat-inline"), newCatBtn = document.getElementById("new-cat-inline-btn");
  if (newCatI) bindCatedraNameSuggest("new-cat-inline", "new-cat-inline-sug");
  if (newCatBtn) newCatBtn.onclick = () => {
    const v = newCatI.value.trim(); if (!v) return;
    if (hasPermission(user, "gestionCatedras")) {
      if (!(data.catedras||[]).some(c => catedraLabel(c) === v)) addCatedra({ name: v, turnos: (user.turnos||[]), dias: [new Date().getDay()] });
    }
    // sin el permiso, la cátedra escrita acá no se suma al catálogo general — queda guardada únicamente en este pedido puntual.
    selectedCatedra = v; newCatI.value = "";
    document.getElementById("cat-selected-label").textContent = `Seleccionada: ${v}`;
  };
  const anI = document.getElementById("anomaly-text"), anBtn = document.getElementById("anomaly-btn");
  anBtn.onclick = () => { if (anI.value.trim()) { reportAnomaly(d.id, anI.value.trim()); anI.value = ""; } };
  root.querySelectorAll("[data-resolve]").forEach(b => b.onclick = () => resolveAnomaly(d.id, b.dataset.resolve));
}

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("firebase-messaging-sw.js").catch(()=>{}));
</script>
</body>
</html>
